services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cluekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluekeeper}
      POSTGRES_DB: cluekeeper
    volumes:
      - cluekeeper-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: cluekeeper-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://cluekeeper:${POSTGRES_PASSWORD:-cluekeeper}@db:5432/cluekeeper
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Para probar en local por http: COOKIE_SECURE=false y COOKIE_SAMESITE=lax
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}

volumes:
  cluekeeper-pg:   # datos de PostgreSQL (incluye fotos/audios)
